name: Build DentalRay Installer

on:
  push:
    branches:
      - master
      - "feature/**"
  workflow_dispatch:

jobs:
  build:
    # Explicit permissions keep the installer build compatible with repositories
    # whose default GITHUB_TOKEN permissions are restricted.
    permissions:
      contents: read
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Version 1 frontend profile
        shell: powershell
        run: |
          node ".\tests\version-one-product-profile.test.cjs"
          node ".\tests\study-clinic-assignment.test.cjs"
          node ".\tests\study-input-contract.test.cjs"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Prepare publish folders
        shell: powershell
        run: |
          if (Test-Path ".\Publish") { Remove-Item ".\Publish" -Recurse -Force }
          New-Item ".\Publish" -ItemType Directory | Out-Null

      - name: Publish DentalRay API
        shell: powershell
        run: |
          dotnet publish ".\DentalRay.Api\DentalRay.Api.csproj" -c Release -r win-x64 --self-contained true -o ".\Publish\DentalRay"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish SetupHelper
        shell: powershell
        run: |
          dotnet publish ".\DentalRay.SetupHelper\DentalRay.SetupHelper.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ".\Publish\DentalRay.SetupHelper"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Copy database upgrade script
        shell: powershell
        run: |
          $databaseDir = ".\Publish\DentalRay.SetupHelper\Database"
          New-Item $databaseDir -ItemType Directory -Force | Out-Null
          Copy-Item ".\DentalRay.SetupHelper\Database\DentalRay.Database.Install.sql" $databaseDir -Force

      - name: Locate Inno Setup compiler
        shell: powershell
        run: |
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Error "ISCC.exe was not found."
            exit 1
          }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ISCC found at: $iscc"

      - name: Compile Inno Setup installer
        shell: powershell
        run: |
          & "$env:ISCC_PATH" ".\Installer\DentalRay.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer output
        shell: powershell
        run: |
          Get-ChildItem ".\Installer\Output" -Force
          if (-not (Get-ChildItem ".\Installer\Output\*.exe" -ErrorAction SilentlyContinue)) {
            Write-Error "DentalRay installer EXE was not created."
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DentalRay-Setup
          path: Installer/Output/*.exe
          if-no-files-found: error
