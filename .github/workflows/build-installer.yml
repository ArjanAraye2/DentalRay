name: Build DentalRay Installer

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish DentalRay API
        run: dotnet publish DentalRay.Api/DentalRay.Api.csproj -c Release -r win-x64 --self-contained true -o publish/DentalRay

      - name: Publish Setup Helper
        run: |
          dotnet publish DentalRay.SetupHelper/DentalRay.SetupHelper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/DentalRay.SetupHelper
          New-Item -ItemType Directory -Force publish/DentalRay.SetupHelper/Database | Out-Null
          Copy-Item DentalRay.Database.Install.sql publish/DentalRay.SetupHelper/Database/DentalRay.Database.Install.sql -Force
          Copy-Item DentalRay.Database.Install.sql publish/DentalRay.SetupHelper/DentalRay.Database.Install.sql -Force

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Compute Persian release stamp
        id: stamp
        shell: powershell
        run: |
          # The installer file name carries the Jalali release date, matching
          # the local build so a file is always identifiable at a glance.
          $pc = New-Object System.Globalization.PersianCalendar
          $now = Get-Date
          $stamp = '{0}{1:00}{2:00}' -f $pc.GetYear($now), $pc.GetMonth($now), $pc.GetDayOfMonth($now)
          "value=$stamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Persian release stamp: $stamp"

      - name: Build Setup
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DSourceRoot="${env:GITHUB_WORKSPACE}\publish" /DReleaseStamp="${{ steps.stamp.outputs.value }}" Installer\DentalRay.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: DentalRay-Installer
          # The version and date live in the .iss file, so collect whatever it built.
          path: Installer/Output/DentalRay_Setup_*.exe
          if-no-files-found: error
