name: Build DentalRay Installer

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish DentalRay API
        run: dotnet publish DentalRay.Api/DentalRay.Api.csproj -c Release -r win-x64 --self-contained true -o publish/DentalRay

      - name: Publish Setup Helper
        run: dotnet publish DentalRay.SetupHelper/DentalRay.SetupHelper.csproj -c Release -r win-x64 --self-contained true -o publish/DentalRay.SetupHelper

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Build Setup
        shell: powershell
        run: |
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" /DSourceRoot="$env:GITHUB_WORKSPACE\publish" Installer\DentalRay.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: DentalRay-Installer
          path: Installer/Output/DentalRay_Setup_1.0.0.exe
          if-no-files-found: error