# DentalRay Mobile - تنظیمات ساخت
#
# تجربی برای همین سیستم: عامل Instrumentation گرادل داخل jvm.dll کرش می‌کند.
# کلید خاموش‌کردنش فقط وقتی اثر می‌کند که داخل org.gradle.jvmargs باشد؛
# اگر تنها خطِ خودش باشد خوانده نمی‌شود و دوباره کرش می‌آید.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dorg.gradle.internal.instrumentation.agent=false
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
