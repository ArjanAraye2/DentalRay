# DentalRay Mobile - تنظیمات ساخت
#
# تجربی برای همین سیستم:
#  1) عامل Instrumentation گرادل داخل jvm.dll کرش می‌کند؛ کلید خاموش‌کردنش
#     فقط وقتی اثر می‌کند که داخل org.gradle.jvmargs باشد.
#  2) جاوا اینجا هم در C1 و هم در C2 کرش می‌کند (EXCEPTION_ACCESS_VIOLATION)،
#     پس مترجم سریع کلاً خاموش می‌شود؛ ساخت کندتر است ولی پایدار می‌ماند.
#     به همین دلیل کامپایل کاتلین هم داخل همین فرآیند انجام می‌شود تا JVM
#     دومی در کار نباشد.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dorg.gradle.internal.instrumentation.agent=false -Xint
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
