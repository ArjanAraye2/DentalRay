<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 140" width="720" height="140" role="img" aria-label="ReSiRai - Medical Intelligence Platform">
  <defs>
    <linearGradient id="waveGradBrand" x1="10" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f3e4e"/>
      <stop offset="0.3" stop-color="#2f3e4e"/>
      <stop offset="0.5" stop-color="#2b9fd6"/>
      <stop offset="0.66" stop-color="#2b9fd6"/>
      <stop offset="0.82" stop-color="#f4511e"/>
      <stop offset="1" stop-color="#f4511e"/>
    </linearGradient>
  </defs>

  <!-- the agreed mark: three-crest wave, straightening into the three dots -->
  <path d="M10 70 q25 -60 50 0 q25 42 50 0 q25 -28 50 0" fill="none" stroke="url(#waveGradBrand)" stroke-width="6" stroke-linecap="round"/>
  <path d="M160 70 H245" fill="none" stroke="#3b4a5a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="70" r="9" fill="#2f3e4e"/>
  <path d="M265 70 H285" stroke="#3b4a5a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="294" cy="70" r="9" fill="#2b9fd6"/>
  <path d="M303 70 H323" stroke="#3b4a5a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="332" cy="70" r="9" fill="#f4511e"/>

  <!-- wordmark: ReSi (dark) → R (cyan) → ai (orange), mirroring the wave -->
  <text x="365" y="84" font-family="'Segoe UI Light','Segoe UI',Arial,sans-serif" font-size="64" font-weight="250" letter-spacing="1"><tspan fill="#2f3e4e">ReSi</tspan><tspan fill="#2b9fd6">R</tspan><tspan fill="#f4511e">ai</tspan></text>

  <text x="368" y="116" font-family="'Segoe UI Light','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" letter-spacing="2.5" fill="#7a8a99">Medical Intelligence Platform</text>
</svg>
