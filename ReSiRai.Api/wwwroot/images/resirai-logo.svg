<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-label="ReSiRai - Medical Intelligence Platform">
  <defs>
    <linearGradient id="waveGradLogo" x1="43" y1="0" x2="243" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f3e4e"/>
      <stop offset="0.26" stop-color="#2f3e4e"/>
      <stop offset="0.46" stop-color="#2b9fd6"/>
      <stop offset="0.62" stop-color="#2b9fd6"/>
      <stop offset="0.80" stop-color="#f4511e"/>
