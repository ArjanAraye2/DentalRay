  <!-- line 1: the mark (43 .. 517)
       A calm damped wave: three crests of decreasing height (52/25/12) with two
       shallow troughs (36/17), then the stroke straightens into the run and the
       three dots - dark, cyan, orange. -->
  <path d="M43 105
           c14.4 -69.3 25.6 -69.3 40 0
           c14.4 47.9 25.6 47.9 40 0
           c14.4 -33.3 25.6 -33.3 40 0
           c14.4 22.6 25.6 22.6 40 0
           c14.4 -16 25.6 -16 40 0"
        fill="none" stroke="url(#waveGradLogo)" stroke-width="7" stroke-linecap="round"/>
  <path d="M243 105 H409" fill="none" stroke="#3b4a5a" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="421" cy="105" r="12" fill="#2f3e4e"/>
  <path d="M433 105 H451" stroke="#3b4a5a" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="463" cy="105" r="12" fill="#2b9fd6"/>
  <path d="M475 105 H493" stroke="#3b4a5a" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="505" cy="105" r="12" fill="#f4511e"/>

  <!-- line 2: the name (43 .. 517) -->
  <text x="280" y="213" text-anchor="middle" textLength="474" lengthAdjust="spacing"
        font-family="'Segoe UI Light','Segoe UI',Arial,sans-serif" font-size="78" font-weight="250"><tspan fill="#2f3e4e">Re</tspan><tspan fill="#2b9fd6">Si</tspan><tspan fill="#f4511e">Rai</tspan></text>

  <!-- line 3: the tagline (43 .. 517) -->
  <text x="280" y="248" text-anchor="middle" textLength="474" lengthAdjust="spacing"
