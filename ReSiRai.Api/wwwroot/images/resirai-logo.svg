  <path d="M469 100 H493" stroke="#3b4a5a" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="505" cy="100" r="12" fill="#f4511e"/>

  <!-- three lines of exactly equal width: 43 .. 517 (474) -->
  <text x="280" y="290" text-anchor="middle" textLength="474" lengthAdjust="spacing"
        font-family="'Segoe UI Light','Segoe UI',Arial,sans-serif" font-size="96" font-weight="250"><tspan fill="#2f3e4e">Re</tspan><tspan fill="#2b9fd6">Si</tspan><tspan fill="#f4511e">Rai</tspan></text>

  <text x="280" y="382" text-anchor="middle" textLength="474" lengthAdjust="spacingAndGlyphs"
