<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>دریافت تصویر رادیولوژی</title>
<!-- این صفحه فقط با شناسهٔ کیوآرکد باز می‌شود و نباید در جست‌وجو بیاید. -->
<meta name="robots" content="noindex, nofollow, noarchive" />
<link rel="icon" href="/images/dentalray.ico" />
<link rel="stylesheet" href="/css/fonts.css" />
<style>
  :root { --ink:#0d3f4f; --muted:#55707e; --line:#d8e7ec; --brand:#0e7f95; --bg:#f2f7f9; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; }
  body {
    font-family: Vazirmatn, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink); line-height:1.9;
    padding-bottom:36px; min-height:100vh;
  }
  header {
    background:linear-gradient(160deg,#0e7f95,#0a5b6d); color:#fff;
    padding:20px 18px 24px; border-radius:0 0 20px 20px;
  }
  header .brand { font-size:12.5px; opacity:.85; }
  header h1 { margin:6px 0 2px; font-size:19px; }
  header .who { font-size:14px; opacity:.92; }
  main { padding:16px; max-width:640px; margin:0 auto; }

  .card {
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:14px;
  }
  .steps { color:var(--muted); font-size:13.5px; margin:0 0 10px; padding-inline-start:20px; }
  .steps li { margin-bottom:6px; }

  textarea {
    width:100%; min-height:130px; border:1px solid var(--line); border-radius:10px;
    padding:12px; font-family:inherit; font-size:14.5px; color:var(--ink);
    background:#fbfefe; resize:vertical;
  }
  textarea:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(14,127,149,.12); }

  button.primary {
    width:100%; min-height:50px; margin-top:12px; border:0; border-radius:12px;
    background:var(--brand); color:#fff; font-family:inherit; font-size:16px; font-weight:700;
    cursor:pointer;
  }
  button.primary:disabled { opacity:.6; }

  #result { display:none; margin-top:14px; padding:14px; border-radius:12px; font-size:14.5px; }
  #result.ok { display:block; background:#e8f7f0; color:#0e7d55; border:1px solid #bfe7d7; }
  #result.warn { display:block; background:#fff4e0; color:#a06400; border:1px solid #f4ddae; }
  #result.err { display:block; background:#fdecec; color:#b42318; border:1px solid #f3c2c0; }

  footer { max-width:640px; margin:18px auto 0; padding:0 16px; color:var(--muted); font-size:12.5px; text-align:center; }
</style>
</head>
<body>
<header>
  <div class="brand">Dentix — دریافت تصویر</div>
  <h1>ارسال پیامک رادیولوژی به مطب</h1>
  <div class="who" id="who">در حال بررسی…</div>
</header>

<main>
  <div class="card">
    <ol class="steps">
      <li>پیامکی که از طرف رادیولوژیست آمده را باز کنید.</li>
      <li><strong>کل متن آن را انتخاب و کپی کنید</strong> (لمس طولانی روی متن ← کپی).</li>
      <li>در جعبهٔ پایین بچسبانید و دکمه را بزنید.</li>
    </ol>

    <textarea id="smsText" placeholder="متن پیامک را اینجا بچسبانید…" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <button id="sendButton" class="primary" type="button">دریافت تصاویر</button>
    <div id="result"></div>
  </div>
</main>

<footer>این صفحه فقط برای همین بیمار است و بدون نصب هیچ برنامه‌ای کار می‌کند.</footer>

<script>
(function () {
  "use strict";
  var token = location.pathname.split("/").pop();
  var api = "/api/receive/" + encodeURIComponent(token);
  var $ = function (id) { return document.getElementById(id); };

  function show(kind, text) {
    var box = $("result");
    box.className = kind;
    box.textContent = text;
    box.style.display = "block";
  }

  fetch(api, { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      $("who").textContent = d.success && d.firstName ? "بیمار: " + d.firstName : "صفحهٔ دریافت تصویر";
      if (!d.success) show("err", d.message || "این لینک معتبر نیست.");
    })
    .catch(function () { $("who").textContent = "دریافت تصویر"; });

  $("sendButton").addEventListener("click", function () {
    var text = $("smsText").value.trim();
    if (text.length < 5) { show("warn", "ابتدا متن پیامک را کپی و بچسبانید."); return; }

    var button = $("sendButton");
    button.disabled = true;
    button.textContent = "در حال دریافت…";
    show("warn", "لینک‌ها در حال بررسی و تصاویر در حال دریافت هستند…");

    fetch(api, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        var d = res.d || {};
        if (!res.ok || !d.success) { show("err", d.message || "ارسال انجام نشد."); return; }
        if (d.outcome === "imported") show("ok", d.message);
        else if (d.outcome === "duplicate") show("warn", d.message);
        else show("warn", d.message);
      })
      .catch(function () { show("err", "اتصال برقرار نشد؛ دوباره تلاش کنید."); })
      .finally(function () {
        button.disabled = false;
        button.textContent = "دریافت تصاویر";
      });
  });
})();
</script>
</body>
</html>
